name: ci

on:
  push:
    branches:
      - "foundation/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify static prototype preview
        if: github.ref == 'refs/heads/feature/product-loop-v1'
        run: |
          base="https://bazi-ai-advisor-git-feature-product-loop-v1-zuriel144000.vercel.app"
          for path in "/" "/birth" "/result"; do
            code=$(curl --silent --show-error --location --output /tmp/preview-body --write-out '%{http_code}' "$base$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "Preview smoke check failed for $path"
              cat /tmp/preview-body
              exit 1
            fi
          done
